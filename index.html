<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslimpreneur Talk | Ultra Dashboard</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        :root { --navy: #0a1d37; --teal: #1a5f60; --gold: #b39a6a; }
        body { background: linear-gradient(135deg, #f8fafc 0%, #d1d5db 100%); min-height: 100vh; color: var(--navy); font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 1.5rem; box-shadow: 0 8px 32px rgba(10, 29, 55, 0.1); }
        .active-tab { background: var(--navy); color: white !important; box-shadow: 0 8px 15px rgba(10, 29, 55, 0.3); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .btn-gold { background-color: var(--gold); color: white; transition: all 0.3s; }
        .btn-gold:hover { background-color: var(--navy); transform: translateY(-2px); }
        .event-title { background: var(--navy); color: #00d2ff; padding: 2px 10px; font-weight: 800; }
    </style>
</head>
<body class="p-4 md:p-8">

    <audio id="beep-sound" src="correct.mp3" preload="auto"></audio>

    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="text-center md:text-left">
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 uppercase">
                    <span class="event-title">MUSLIMPRENEUR</span> <span class="italic font-light">Talk</span>
                </h1>
                <div class="flex items-center justify-center md:justify-start gap-2 mt-2">
                    <span id="indicator" class="w-2 h-2 rounded-full bg-slate-400"></span>
                    <p id="status-text" class="text-[10px] uppercase tracking-widest text-slate-500 font-bold">System Standby</p>
                </div>
            </div>

            <div class="bg-white/60 p-1.5 rounded-2xl border border-white flex gap-1 shadow-sm">
                <button onclick="switchTab('list', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold active-tab transition-all">DATABASE</button>
                <button onclick="switchTab('scan', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 transition-all">SCANNER</button>
                <button onclick="switchTab('gen', this)" class="tab-btn px-5 py-2.5 rounded-xl text-xs font-bold text-slate-500 transition-all">AMBIL TIKET</button>
            </div>
        </header>

        <section id="tab-list" class="tab-content active">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                <div class="lg:col-span-1 space-y-4">
                    <div class="glass overflow-hidden">
                        <img src="poster.jpeg" alt="Poster Event" class="w-full h-auto object-cover">
                        <div class="p-4 bg-navy text-white text-center">
                            <p class="text-[10px] font-bold tracking-widest uppercase opacity-70">Event Date</p>
                            <p class="text-xs font-bold italic text-blue-300">Ahad, 15 Februari 2026</p>
                        </div>
                    </div>
                    <div onclick="setFilter('ALL')" class="glass p-6 border-l-4 border-slate-600 cursor-pointer hover:bg-white transition-all">
                        <p class="text-slate-500 text-[10px] font-bold uppercase mb-1">Total Peserta</p>
                        <h2 id="count-all" class="text-4xl font-black text-slate-800 tracking-tighter">0</h2>
                    </div>
                    <div onclick="setFilter('HADIR')" class="glass p-6 border-l-4 border-emerald-500 cursor-pointer hover:bg-white transition-all">
                        <p class="text-emerald-600 text-[10px] font-bold uppercase mb-1">Sudah Hadir</p>
                        <h2 id="count-hadir" class="text-4xl font-black text-emerald-600 tracking-tighter">0</h2>
                    </div>
                    <div onclick="setFilter('PENDING')" class="glass p-6 border-l-4 border-rose-500 cursor-pointer hover:bg-white transition-all">
                        <p class="text-rose-600 text-[10px] font-bold uppercase mb-1">Belum Hadir</p>
                        <h2 id="count-pending" class="text-4xl font-black text-rose-600 tracking-tighter">0</h2>
                    </div>
                </div>

                <div class="lg:col-span-3">
                    <div class="glass overflow-hidden bg-white/90">
                        <div class="p-4 border-b border-slate-100 flex gap-4">
                            <input type="text" id="search" onkeyup="renderList()" placeholder="Cari nama atau kecamatan..." 
                                class="bg-slate-50 border border-slate-200 rounded-xl px-6 py-3 w-full outline-none text-sm">
                        </div>
                        <div class="overflow-y-auto max-h-[60vh]">
                            <table class="w-full text-left">
                                <thead class="sticky top-0 bg-slate-50 text-slate-400 text-[10px] font-bold uppercase tracking-widest">
                                    <tr>
                                        <th class="p-5">ID</th>
                                        <th class="p-5">Nama Peserta</th>
                                        <th class="p-5">Kecamatan</th>
                                        <th class="p-5">Waktu</th>
                                        <th class="p-5 text-center">Status</th>
                                    </tr>
                                </thead>
                                <tbody id="list-body" class="divide-y divide-slate-100"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-scan" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass p-6 bg-white border-2 border-white">
                    <div id="reader" class="rounded-2xl overflow-hidden border-4 border-slate-100 bg-slate-50 aspect-square"></div>
                </div>
                <div class="flex flex-col gap-4">
                    <h3 class="px-2 font-black text-navy text-sm uppercase tracking-widest">Live Check-in Log</h3>
                    <div id="recent-scans" class="space-y-3">
                        <div class="glass p-10 text-center text-slate-400 italic text-sm">Scan QR Tiket untuk memulai...</div>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-gen" class="tab-content">
            <div class="glass p-8 bg-white/90">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                    <div>
                        <h3 class="font-black text-navy text-2xl uppercase">E-Ticket Manager</h3>
                        <p class="text-sm text-slate-500">Kelola tiket massal (Print atau ZIP).</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="printSeluruhTiket()" class="px-4 py-3 bg-slate-800 text-white rounded-xl font-bold text-[10px] uppercase shadow-lg hover:scale-105 transition-all">🖨️ Print Semua</button>
                        <button onclick="downloadSemuaTiketZIP()" class="px-4 py-3 bg-blue-600 text-white rounded-xl font-bold text-[10px] uppercase shadow-lg hover:scale-105 transition-all">📦 Download ZIP</button>
                    </div>
                </div>
                <input type="text" id="searchGen" onkeyup="renderGenerator()" placeholder="Ketik nama untuk cari tiket individu..." 
                    class="bg-white border border-slate-200 rounded-2xl px-6 py-4 w-full focus:ring-4 focus:ring-teal-100 outline-none mb-8">
                <div id="gen-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></div>
            </div>
        </section>
    </div>

    <div id="qr-hidden" class="hidden"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzofsQwtuM4L0SVsNJdxOw7_otzCLKgPHXKkjLY_n1RpvB8trvDWRfYqMoS_VzBYlW9Zg/exec"; 
        let participants = [];
        let html5QrCode;
        let currentFilter = "ALL";

        async function loadData() {
            setSyncStatus("Connecting...", "bg-amber-400");
            try {
                const res = await fetch(SCRIPT_URL);
                participants = await res.json();
                renderList(); updateStats();
                setSyncStatus("Connected", "bg-emerald-500");
            } catch (e) { setSyncStatus("Offline", "bg-red-400"); }
        }

        function setSyncStatus(text, color) {
            document.getElementById('status-text').innerText = text;
            document.getElementById('indicator').className = `w-2 h-2 rounded-full ${color}`;
        }

        function updateStats() {
            const total = participants.length;
            const hadir = participants.filter(p => p.STATUS === "HADIR").length;
            document.getElementById('count-all').innerText = total;
            document.getElementById('count-hadir').innerText = hadir;
            document.getElementById('count-pending').innerText = total - hadir;
        }

        function switchTab(type, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active-tab'); b.classList.add('text-slate-500'); });
            document.getElementById(`tab-${type}`).classList.add('active');
            btn.classList.add('active-tab');
            if (type === 'scan') {
                if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 250 }, (txt) => markAttendance(txt.trim())).catch(()=>{});
            } else if (html5QrCode) { html5QrCode.stop().catch(()=>{}); }
        }

        function renderList() {
            const query = document.getElementById('search').value.toLowerCase();
            const body = document.getElementById('list-body');
            body.innerHTML = "";
            participants.filter(p => {
                const matchSearch = (p.NAMA || "").toLowerCase().includes(query) || (p.KECAMATAN || "").toLowerCase().includes(query);
                let matchFilter = true;
                if (currentFilter === "HADIR") matchFilter = (p.STATUS === "HADIR");
                if (currentFilter === "PENDING") matchFilter = (p.STATUS !== "HADIR");
                return matchSearch && matchFilter;
            }).forEach(p => {
                const isHadir = p.STATUS === "HADIR";
                body.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-all">
                        <td class="p-5 font-mono text-[10px] text-slate-400">${p["NO."] || p.NO_REGISTRASI}</td>
                        <td class="p-5 font-bold text-navy uppercase text-[11px]">${p.NAMA}</td>
                        <td class="p-5 text-slate-500 text-xs">${p.KECAMATAN}</td>
                        <td class="p-5 font-mono text-[10px] text-slate-500">${p.WAKTU || "-"}</td>
                        <td class="p-5 text-center">
                            <span class="px-3 py-1 rounded-full text-[9px] font-black ${isHadir ? 'bg-teal-100 text-teal-700' : 'bg-slate-100 text-slate-400'}">
                                ${isHadir ? '✓ HADIR' : 'PENDING'}
                            </span>
                        </td>
                    </tr>`;
            });
        }

        async function markAttendance(id) {
            const beep = document.getElementById("beep-sound");
            const index = participants.findIndex(p => String(p["NO."]) === String(id) || String(p.NO_REGISTRASI) === String(id));

            if (index === -1) {
                Swal.fire({ icon: 'error', title: 'TIDAK TERDAFTAR', text: `ID ${id} tidak ada di database!` });
                return;
            }

            const person = participants[index];
            if (person.STATUS === "HADIR") {
                Swal.fire({ icon: 'warning', title: 'SUDAH HADIR', text: `${person.NAMA} sudah check-in.` });
                return;
            }

            Swal.fire({ title: 'Menghubungi Cloud...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            try {
                await fetch(SCRIPT_URL, { method: "POST", mode: 'no-cors', body: JSON.stringify({ id: id }) });
                
                if (beep) beep.play();
                
                const now = new Date();
                const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;
                person.STATUS = "HADIR";
                person.WAKTU = timeStr;

                addToRecent(person);
                renderList(); updateStats();
                setSyncStatus("Last Sync: " + timeStr, "bg-emerald-500");

                Swal.fire({ icon: 'success', title: 'BERHASIL CHECK-IN', text: `Selamat datang, ${person.NAMA}`, timer: 1500, showConfirmButton: false });
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'GAGAL', text: 'Koneksi internet bermasalah' });
            }
        }

        function addToRecent(person) {
            const container = document.getElementById('recent-scans');
            if (container.querySelector('div.italic')) container.innerHTML = "";
            const el = document.createElement('div');
            el.className = "glass p-4 flex justify-between items-center bg-white border-l-4 border-teal-500 animate-bounce";
            el.innerHTML = `<div><p class="font-bold text-navy uppercase text-xs">${person.NAMA}</p><p class="text-[9px] text-teal-700 uppercase">${person.KECAMATAN}</p></div><div class="text-[10px] font-black text-slate-400">${person.WAKTU}</div>`;
            container.prepend(el);
            setTimeout(() => el.classList.remove('animate-bounce'), 1000);
        }

        // --- CORE TICKET ENGINE ---
        async function getTicketBase64(p) {
            return new Promise((resolve) => {
                const rawNo = p.NO_REGISTRASI || p["NO REGISTRASI"] || p["NO."];
                const formattedNo = String(rawNo).padStart(5, '0');
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 800; canvas.height = 1200;

                // Background
                ctx.fillStyle = '#0a1d37'; ctx.fillRect(0, 0, 800, 1200);
                ctx.fillStyle = '#b39a6a'; ctx.fillRect(0, 0, 800, 20);
                ctx.textAlign = 'center';

                // Text
                ctx.fillStyle = '#30dbb9'; ctx.font = 'bold 35px Arial'; ctx.fillText('MUSLIMPRENEUR TALK', 400, 100);
                ctx.fillStyle = '#ffffff'; ctx.font = '900 25px Arial'; ctx.fillText('CLASS OF CEO: CASH FLOW TRANSFORMATION', 400, 180);
                ctx.fillStyle = '#b39a6a'; ctx.font = 'bold 30px Courier New'; ctx.fillText(`tiket no : ${formattedNo}`, 400, 270);
                
                // QR Area
                ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.roundRect(180, 300, 440, 440, 50); ctx.fill();

                const qrDiv = document.createElement('div');
                new QRCode(qrDiv, { text: String(rawNo), width: 380, height: 380 });
                
                setTimeout(() => {
                    const qrImg = qrDiv.querySelector('img');
                    ctx.drawImage(qrImg, 210, 330, 380, 380);
                    ctx.fillStyle = '#ffffff'; ctx.font = '900 50px Arial'; ctx.fillText(p.NAMA.toUpperCase(), 400, 900);
                    ctx.fillStyle = '#94a3b8'; ctx.font = 'bold 30px Arial'; ctx.fillText(p.KECAMATAN, 400, 960);
                    ctx.fillStyle = '#b39a6a'; ctx.font = 'italic 20px Arial'; ctx.fillText('Ahad, 5 April 2026  | President Executive Club (PEC) Jababeka', 400, 1100);
                    resolve(canvas.toDataURL("image/png"));
                }, 100);
            });
        }

        // --- MASS ACTIONS ---
        async function printSeluruhTiket() {
            Swal.fire({ title: 'Menyiapkan Render...', text: 'Memuat semua tiket ke jendela print', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
            const printWindow = window.open('', '_blank');
            printWindow.document.write('<html><head><title>Print All</title><style>body{margin:0;display:flex;flex-direction:column;align-items:center} img{width:100%;max-width:600px;page-break-after:always;margin-bottom:20px;}</style></head><body>');
            for (const p of participants) {
                const img = await getTicketBase64(p);
                printWindow.document.write(`<img src="${img}">`);
            }
            printWindow.document.write('</body></html>');
            printWindow.document.close();
            printWindow.onload = () => { Swal.close(); printWindow.print(); };
        }

        async function downloadSemuaTiketZIP() {
            if (participants.length === 0) return;
            const confirm = await Swal.fire({ title: 'Bikin ZIP?', text: `Bungkus ${participants.length} tiket ke ZIP?`, icon: 'question', showCancelButton: true });
            if (!confirm.isConfirmed) return;

            const zip = new JSZip();
            const folder = zip.folder("Tiket_Muslimpreneur");
            
            Swal.fire({ title: 'Memproses ZIP...', html: '<p id="zip-info">Merakit tiket (0%)</p>', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

            for (let i = 0; i < participants.length; i++) {
                const p = participants[i];
                const dataUrl = await getTicketBase64(p);
                const base64Data = dataUrl.replace(/^data:image\/(png|jpg);base64,/, "");
                const fileName = `${String(p["NO."] || i+1).padStart(5, '0')}-${p.NAMA.replace(/\s+/g, '_')}.png`;
                folder.file(fileName, base64Data, {base64: true});
                
                document.getElementById('zip-info').innerText = `Merakit tiket (${Math.round(((i+1)/participants.length)*100)}%)`;
            }

            const content = await zip.generateAsync({type: "blob"});
            saveAs(content, "Semua_Tiket_Muslimpreneur.zip");
            Swal.fire('Selesai!', 'File ZIP berhasil di-download.', 'success');
        }

        function renderGenerator() {
            const query = document.getElementById('searchGen').value.toLowerCase();
            const grid = document.getElementById('gen-grid');
            grid.innerHTML = "";
            if (query.length < 2) return;
            participants.filter(p => (p.NAMA || "").toLowerCase().includes(query)).forEach(p => {
                const card = document.createElement('div');
                card.className = "flex flex-col items-center gap-3";
                card.innerHTML = `
                    <div class="w-full bg-[#0a1d37] rounded-3xl p-6 text-white text-center shadow-xl border-2 border-[#b39a6a]">
                        <p class="text-[10px] font-black uppercase mb-4 text-teal-400">${p.NAMA}</p>
                        <div id="preview-qr-${p["NO."] || p.NO_REGISTRASI}" class="bg-white p-2 rounded-xl w-32 h-32 mx-auto mb-2"></div>
                    </div>
                    <button onclick='generateAndDownloadTicketIndividual(${JSON.stringify(p)})' class="w-full py-2 btn-gold text-[10px] font-black rounded-xl uppercase">Download PNG</button>`;
                grid.appendChild(card);
                new QRCode(document.getElementById(`preview-qr-${p["NO."] || p.NO_REGISTRASI}`), { text: String(p["NO."] || p.NO_REGISTRASI), width: 128, height: 128 });
            });
        }

        async function generateAndDownloadTicketIndividual(p) {
            const dataUrl = await getTicketBase64(p);
            const link = document.createElement('a');
            link.download = `Ticket-${p.NAMA}.png`;
            link.href = dataUrl;
            link.click();
        }

        loadData();
    </script>
</body>
</html>
